name: Build Manager APK Only

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'manager/**'
      - '.github/workflows/build-manager-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'manager/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        working-directory: manager
        run: chmod +x gradlew

      - name: Write fixed keystore
        working-directory: manager
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::KS_B64 / KS_PASS secrets are not set."
            exit 1
          fi
          printenv KS_B64 | base64 -d > "$RUNNER_TEMP/ksu.jks"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ksu.jks"
            printf 'KEYSTORE_PASSWORD='
            printenv KS_PASS
            echo "KEY_ALIAS=ksu"
            printf 'KEY_PASSWORD='
            printenv KS_PASS
          } >> gradle.properties

      - name: Build Release APK
        working-directory: manager
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: manager
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature
        if: success()
        run: |
          ls manager/app/build/outputs/apk/release/*.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs manager/app/build/outputs/apk/release/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: custom-ksu-manager-release
          path: manager/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Get APK info
        if: success()
        run: |
          echo "=== Build Complete ==="
          echo "Release APK:"
          ls -lh manager/app/build/outputs/apk/release/*.apk 2>/dev/null || echo "No release APK found"
          echo ""
          echo "Debug APK:"
          ls -lh manager/app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "No debug APK found"

